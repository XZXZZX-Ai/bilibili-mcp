name: Verify

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: Product
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v7.0.1 resolved from the official actions/checkout repository on 2026-08-16.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # v7.0.0 resolved from the official actions/setup-node repository on 2026-08-16.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check package contents
        run: |
          npm pack --dry-run --json --ignore-scripts > pack-output.json
          node -e "
          const files = JSON.parse(require('fs').readFileSync('pack-output.json', 'utf8'))[0].files.map(f => f.path);
          const prefixes = ['harness/', '.harness/', 'docs/agent-memory/', 'tests/', 'strix_runs/'];
          const markers = ['recovery-bundle', 'events.jsonl'];
          const bad = files.filter(p => prefixes.some(x => p.startsWith(x)) || markers.some(x => p.includes(x)));
          if (bad.length) { console.error('forbidden paths in npm package: ' + bad.join(', ')); process.exit(1); }
          console.log('package contents OK: ' + files.length + ' files');
          "

  fake_ip_node:
    name: Fake-IP Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 25]
    steps:
      # v7.0.1 resolved from the official actions/checkout repository on 2026-08-16.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.0.0 resolved from the official actions/setup-node repository on 2026-08-16.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Fake-IP contracts
        run: npm run test:fake-ip

  required:
    name: Required
    if: always()
    needs:
      - product
      - fake_ip_node
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all verification jobs
        env:
          PRODUCT_RESULT: ${{ needs.product.result }}
          FAKE_IP_NODE_RESULT: ${{ needs.fake_ip_node.result }}
        run: >-
          test "$PRODUCT_RESULT" = success &&
          test "$FAKE_IP_NODE_RESULT" = success
