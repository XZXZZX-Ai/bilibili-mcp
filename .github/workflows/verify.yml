name: Verify

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: Product
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v7.0.1 resolved from the official actions/checkout repository on 2026-08-16.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.0.0 resolved from the official actions/setup-node repository on 2026-08-16.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify product
        run: npm run verify:local

  fake_ip_node:
    name: Fake-IP Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 25]
    steps:
      # v7.0.1 resolved from the official actions/checkout repository on 2026-08-16.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.0.0 resolved from the official actions/setup-node repository on 2026-08-16.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Fake-IP contracts
        run: npm run test:fake-ip
